<!DOCTYPE html>
<html>
<head>
    <title>Styled Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .blue-text {
            color: blue;
        }

        #main-footer {
            font-size: 12px;
            color: gray;
        }

        ul {
            list-style-type: square;
            color: rgb(220, 22, 22);
        }
    </style>
</head>
<body>

    <h1 class="blue-text">My Styled Heading</h1>
    
    <ul>
        <li>First Item</li>
        <li>Second Item</li>
    </ul>

    <hr>

    <p id="main-footer"> css is used to tell the browser exactly how elements should look</p>

</body>
</html>
