<!DOCTYPE html>
<html>
<head>
    <style>
      
        .box-example {
            width: 300px;
            background-color: #f0f0f0;
            
          
            margin: 20px; 
            border: 5px solid #3498db; 
            padding: 15px; 
        }

      
        .block-element {
            background-color: #e74c3c;
            color: white;
            padding: 10px;
            margin-bottom: 10px;
        }

       
        .inline-element {
            color: #2ecc71;
            font-weight: bold;
            border-bottom: 2px dashed #2ecc71;
        }
    </style>
</head>
<body>

    <h2>The Box Model & Containers</h2>

    <div class="box-example">
        <div class="block-element">I am a Div (Block Level)</div>
        
        <p>
            This paragraph is inside a div. I can use a 
            <span class="inline-element">Span (Inline Level)</span> 
            to style just a few words without breaking the line.
        </p>
    </div>

</body>
</html>
