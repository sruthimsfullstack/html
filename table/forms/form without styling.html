<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration form</title>
</head>
<body>
   <form>
    <h1>student registration form</h1>
    <div>
        <label for="username">name</label>
        <input id="username name="username" type="text"/>
    </div>

    <div>
        <label for="useremail">email</label>
        <input id="useremail" name="useremail" type="email"/>
    </div>

    <div>
        <label for="userpassword">password</label>
        <input id="userpassword" name="userpassword" type="password"/>
    </div>

    <div>
        <label for="dob">date of birth</label>
        <input id="dob" name="userdob" type="date"/>
    </div>

    <div>
        <label>gender</label>
        <input id="male" name="gender" type="radio"/>male
        <input id="female" name="gender" type="radio"/>female
    </div>

    <div>
        <label>hobbies</label>
        <input id="hobby1" name="hobby" type="checkbox"/>sports
        <input id="hobby2" name="hobby" type="checkbox"/>music
         <input id="hobby3" name="hobby" type="checkbox"/>travel
    </div>

    <div>
        <label>country</label>
        <select id="country" name="usercountry">
            <option>india</option>
            <option>uk</option>
            <option>us</option>
        </select>
    </div>

    <div>
        <label for="comments">comments</label>
        <textarea row="5" id="comments" name="usercomments"></textarea>
    </div>

    <div>
        <button>submit</button>
        <span>already account please sign with <strong>google</strong></span>
    </div>
   </form> 
</body>
</html>
