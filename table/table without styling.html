</head>

    <thead>
        <tr>
            <th>column1</th>
            <th>column2</th>

            <td>data col-row1</td>

            <td>data co3-row1</td>
        </tr>
         <tr>
            <td>data col-row2</td>

        </tr>
         <tr>
            <td>data col-row3</td>

        </tr>
    </tbody>
    <tfoot>
        <tr>
            <td>total 1</td>
            <td>total 2</td>
            <td>total 3</td>
        </tr>
    </tfoot>
   </table>
