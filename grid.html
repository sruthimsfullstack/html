<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grids</title>
    <style>
        .grid-container{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:10px
        }
        .grid-item{
            border: 1px solid limegreen;
        }
    </style>
</head>
<body>
   <div class="grid-container">
    <div class="grid-item"><p>paragraph</p></div>
    <div class="grid-item"><p>paragraph</p></div>
    <div class="grid-item"><p>paragraph</p></div>
   </div> 
</body>
</html>
